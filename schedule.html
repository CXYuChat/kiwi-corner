<!doctype html>
<html lang="en" class="locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>This Week 🥝</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFF8E7">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kiwi Corner">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="week">
  <main class="wrap stack">
    <section class="card status-card" id="status-card" aria-live="polite">
      <div class="mascot" id="status-mascot" role="button" tabindex="0" aria-label="Tap the kiwi for a love note">
        <div class="bubble" id="bubble" style="left:0;bottom:100%"></div>
        <div data-mascot></div>
      </div>
      <div>
        <div class="label">Right now Chengxuan is…</div>
        <div class="head" id="status-head">…</div>
        <div class="sub" id="status-sub"></div>
        <span class="chip" id="status-chip" hidden></span>
      </div>
    </section>

    <section class="card cd-card" id="big-cd"></section>

    <div class="duo">
      <section class="card clock">
        <span class="emoji">🌸</span>
        <div class="label">My time (Barcelona)</div>
        <div class="time" id="clock-her">…</div>
        <div class="small muted" id="clock-her-day"></div>
      </section>
      <section class="card clock">
        <span class="emoji">🥝</span>
        <div class="label" id="clock-me-label">Chengxuan's time</div>
        <div class="time" id="clock-me">…</div>
        <div class="small muted" id="clock-me-day"></div>
      </section>
    </div>

    <section class="card cal-card">
      <h2>This week 📅</h2>
      <div class="controls">
        <div class="seg" role="group" aria-label="Time zone">
          <button type="button" data-mode="her" aria-pressed="true">🌸 My time</button>
          <button type="button" data-mode="me" aria-pressed="false" id="mode-me">🥝 His time</button>
        </div>
        <div class="seg" role="group" aria-label="Detail level">
          <button type="button" data-view="simple" aria-pressed="true">Simple</button>
          <button type="button" data-view="all" aria-pressed="false">Expand all</button>
        </div>
      </div>
      <div class="days" id="days" role="group" aria-label="Day"></div>
      <div class="legend">
        <span><i class="l-busy"></i>busy</span>
        <span><i class="l-text"></i>can text</span>
        <span><i class="l-both"></i>both free</span>
        <span><i class="l-est"></i>estimate</span>
        <span><i class="l-now"></i>now</span>
      </div>
      <p class="muted" style="font-size:.88rem;margin:0 6px 10px">Tap a big block to see the details inside ✨</p>
      <div class="cal-scroll" id="cal-scroll">
        <div class="cal-head">
          <div></div>
          <div>Chengxuan 🥝<small>what he's doing</small></div>
          <div>Me 🌸<small>school</small></div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </section>
  </main>
  <button class="btn brown backbar" id="backbar" type="button">← Back to simple view</button>
  <main hidden>
  </main>
  <footer class="footer">Made with 💚 from Singapore to Barcelona</footer>

  <script src="schedule.js"></script>
  <script src="gifts.js"></script>
  <script src="notes.js"></script>
  <script src="questions.js"></script>
  <script src="config.js"></script>
  <script src="time.js"></script>
  <script src="store.js"></script>
  <script src="common.js"></script>
  <script src="schedule-page.js"></script>
</body>
</html>
